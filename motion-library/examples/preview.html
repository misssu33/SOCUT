<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국어 자막 모션 라이브러리 — 미리보기</title>
<style>
  :root { --ink:#0b0d12; --line:#262b36; --muted:#8b93a5; --accent:#ff3d6e; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0b0d12; color:#eef1f6; font:14px/1.5 "Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  header { padding:18px 20px 10px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:17px; }
  p.sub { margin:0; color:var(--muted); font-size:12px; }
  main { display:grid; grid-template-columns:minmax(300px,420px) 1fr; gap:20px; padding:20px; align-items:start; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  .stage-wrap { background:#05070a; border:1px solid var(--line); border-radius:14px; padding:12px; }
  canvas#stage { width:100%; height:auto; display:block; border-radius:8px; background:#101522; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  label.f { display:block; margin:0 0 12px; }
  label.f span { display:block; color:var(--muted); font-size:12px; margin-bottom:4px; }
  select, input[type=text], textarea { width:100%; background:#121722; color:#eef1f6; border:1px solid var(--line); border-radius:9px; padding:9px 10px; font:inherit; }
  textarea { min-height:64px; resize:vertical; }
  button { background:#1b2230; color:#eef1f6; border:1px solid var(--line); border-radius:9px; padding:9px 14px; font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  button.on { outline:2px solid var(--accent); }
  .meta { color:var(--muted); font-size:12px; margin-top:10px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chips button { padding:6px 10px; font-size:12px; }
  input[type=range] { width:100%; }
  code { background:#121722; padding:1px 5px; border-radius:5px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>한국어 자막 모션 라이브러리 · 미리보기</h1>
  <p class="sub"><code>motions.js</code> 하나로 동작합니다. 여기 보이는 화면과 <code>render_mp4.py</code>가 만드는 MP4가 같은 프리셋을 씁니다.</p>
</header>
<main>
  <div>
    <div class="stage-wrap"><canvas id="stage" width="540" height="960"></canvas></div>
    <div class="meta" id="meta">—</div>
  </div>
  <div>
    <label class="f"><span>모션 프리셋</span>
      <select id="preset"></select>
    </label>
    <label class="f"><span>테마</span>
      <select id="theme"></select>
    </label>
    <label class="f"><span>자막 텍스트 (줄바꿈은 자동)</span>
      <textarea id="text">카메라가 놓친 오른쪽 4명 칼군무</textarea>
    </label>
    <div class="row">
      <button id="play" class="primary">▶ 재생</button>
      <button id="safe">안전영역</button>
      <button id="scrim">하단 스크림</button>
      <button id="bg">배경 전환</button>
    </div>
    <label class="f"><span>시간 <b id="tlabel">0.00s</b></span>
      <input type="range" id="t" min="0" max="3000" value="600">
    </label>
    <div class="chips" id="chips"></div>
  </div>
</main>
<script src="../motions.js"></script>
<script>
(function () {
  var ML = window.KoreanMotion;
  var stage = document.getElementById('stage');
  var ctx = stage.getContext('2d');
  var $ = function (id) { return document.getElementById(id); };
  var state = { preset: 'pop-bounce', theme: 'reels-dark', t: 0.6, safe: false, scrim: false, bg: 0, playing: false };
  var DURATION = 3.0;
  var bgIndex = 0;

  // 재생용 데모 영상 대신: 단색 그라데이션 배경(실제 영상은 render_mp4.py가 합성한다)
  var BGS = [
    function () { var g = ctx.createLinearGradient(0, 0, 0, stage.height); g.addColorStop(0, '#243b55'); g.addColorStop(1, '#141e30'); return g; },
    function () { var g = ctx.createLinearGradient(0, 0, stage.width, stage.height); g.addColorStop(0, '#ffb88c'); g.addColorStop(1, '#de6262'); return g; },
    function () { var g = ctx.createLinearGradient(0, 0, 0, stage.height); g.addColorStop(0, '#e8f2e2'); g.addColorStop(1, '#cfe0c3'); return g; }
  ];

  ML.listPresets().forEach(function (p) {
    var o = document.createElement('option'); o.value = p.id; o.textContent = p.label + ' · ' + p.id; $('preset').appendChild(o);
  });
  ML.listThemes().forEach(function (t) {
    var o = document.createElement('option'); o.value = t.id; o.textContent = t.label; $('theme').appendChild(o);
  });
  $('preset').value = state.preset;

  function cues() {
    var text = $('text').value.trim() || '자막을 입력하세요';
    return [{ id: 'c0', start: 0.2, end: 2.6, text: text, preset: state.preset, theme: state.theme }];
  }

  function frame() {
    ctx.clearRect(0, 0, stage.width, stage.height);
    ctx.fillStyle = BGS[bgIndex]();
    ctx.fillRect(0, 0, stage.width, stage.height);
    // 배경에 사물이 있는 느낌(자막 대비 확인용)
    ctx.save();
    ctx.globalAlpha = 0.18; ctx.fillStyle = '#000';
    for (var i = 0; i < 5; i++) ctx.fillRect(0, 300 + i * 120, stage.width, 40);
    ctx.restore();
    var info = ML.drawFrame(ctx, {
      cues: cues(), t: state.t, W: stage.width, H: stage.height,
      preset: state.preset, theme: state.theme,
      scrim: state.scrim ? { alpha: 0.55, height: 0.34 } : null,
      debug: state.safe
    });
    $('meta').textContent = 't=' + state.t.toFixed(2) + 's / 큐 0.20–2.60s · ' +
      (info ? ('글자 ' + info.size.toFixed(1) + 'px · ' + info.lines + '줄 · 블록높이 ' + info.blockH.toFixed(0) + 'px') : '자막 없음');
    $('tlabel').textContent = state.t.toFixed(2) + 's';
  }

  function bind(id, fn) { $(id).addEventListener('input', fn); $(id).addEventListener('change', fn); }
  bind('preset', function (e) { state.preset = e.target.value; frame(); });
  bind('theme', function (e) { state.theme = e.target.value; frame(); });
  bind('text', function () { frame(); });
  bind('t', function (e) { state.t = Number(e.target.value) / 1000; if (!state.playing) frame(); });
  $('safe').addEventListener('click', function () { state.safe = !state.safe; this.classList.toggle('on', state.safe); frame(); });
  $('scrim').addEventListener('click', function () { state.scrim = !state.scrim; this.classList.toggle('on', state.scrim); frame(); });
  $('bg').addEventListener('click', function () { bgIndex = (bgIndex + 1) % BGS.length; frame(); });

  // 프리셋 퀵 칩
  ML.listPresets().forEach(function (p) {
    var b = document.createElement('button');
    b.textContent = p.label; b.dataset.id = p.id;
    b.addEventListener('click', function () {
      state.preset = p.id; $('preset').value = p.id;
      Array.prototype.forEach.call(document.querySelectorAll('#chips button'), function (x) { x.classList.toggle('on', x.dataset.id === p.id); });
      frame();
    });
    $('chips').appendChild(b);
  });

  // 재생 루프
  var last = 0;
  $('play').addEventListener('click', function () {
    state.playing = !state.playing;
    this.textContent = state.playing ? '❚❚ 멈춤' : '▶ 재생';
    if (state.playing) { state.t = 0.2; last = performance.now(); requestAnimationFrame(tick); }
  });
  function tick(now) {
    if (!state.playing) return;
    state.t += (now - last) / 1000; last = now;
    if (state.t > 2.8) state.t = 0.2;
    $('t').value = Math.round(state.t * 1000);
    frame();
    requestAnimationFrame(tick);
  }

  // 테스트/외부 제어용
  window.__demo = {
    set: function (o) { Object.assign(state, o); $('preset').value = state.preset; $('theme').value = state.theme; frame(); },
    frame: frame,
    state: state
  };
  frame();
})();
</script>
</body>
</html>
